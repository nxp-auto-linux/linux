%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/nxp,carvnet-rproc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP CAR-V Accelerator

description:
  This binding provides support for CAR-V, initially found on NXP S32N7x SoCs.
  The CAR-V (Coherent-mesh Acceleration RISC-V) comprises a grid of many small,
  interconnected Cores running at high frequency to allow for a high degree
  of parallelism.
  The CAR-V-NET mode implements networking acceleration and custom processing
  support for companion ENETC Ethernet controller.

maintainers:
  - Jan Petrous <jan.petrous@nxp.com>

properties:
  compatible:
    enum:
      - nxp,carvnet-rproc

  reg:
    description:
      Address ranges of the CAR-V system interface registers for each
      quartile within the CAR-V partition. Each CAR-V partition is
      interfaced by separate instance of the nxp_carvnet_rproc kernel
      driver. If partition contains two quartiles, there are 2 address
      ranges in this reg list, otherwise there is only 1 address range.
    minItems: 1
    maxItems: 2

  memory-region:
    description:
      A phandle for a reserved memory areas that are used for vdev buffers,
      firmware used by remote processor or user regions. There are 4 priority
      regions, first one occupied by the 3 virtio carveouts (vring0/vring1/vdev)
      and the other 3 available for user-defined regions.
    minItems: 1
    maxItems: 6

  memory-region-names:
    maxItems: 6

  firmware-name:
    description:
      Default name of the firmware to load to the CAR-V processor.

  interrupts:
    minItems: 1
    maxItems: 1

  nxp,s32n7-carv-mem-region-types:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      Type of the CarV memory used as attribute of the BAR register
    minItems: 1
    maxItems: 6

required:
  - compatible
  - reg
  - memory-region
  - memory-region-names
  - firmware-name
  - interrupts
  - nxp,s32n7-carv-mem-region-types

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/memory/s32n7-carv.h>

    /* A setup using one Quartile */
    carv-user@47810000 {
      compatible = "nxp,carvnet-rproc";
      reg = <0x47810000 0x10000>;
      interrupts = <GIC_SPI 279 IRQ_TYPE_LEVEL_HIGH>;
      status = "okay";
      firmware-name = "s32n7-carvnet.fw";
      memory-region = <&carv0_reserved>, <&carv0_vdev0vring0>,
          <&carv0_vdev0vring1>, <&carv0_vdev0buffer>, <&carv0_packet_sram>;
      memory-region-names = "carv-reserved","vdev0vring0",
          "vdev0vring1","vdev0buffer","packet-sram";
      nxp,s32n7-carv-mem-region-types = <CARV_MEM_NONCOHERENT>,<CARV_MEM_NONCOHERENT>,
          <CARV_MEM_NONCOHERENT>,<CARV_MEM_NONCOHERENT>,<CARV_MEM_SHARED>;
    };
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/memory/s32n7-carv.h>

    /* A setup using two Quartiles */
    carv-user@47810000 {
      compatible = "nxp,carvnet-rproc";
      reg = <0x47810000 0x10000>,<0x47860000 0x10000>;
      interrupts = <GIC_SPI 279 IRQ_TYPE_LEVEL_HIGH>;
      status = "okay";
      firmware-name = "s32n7-carvnet.fw";
      memory-region = <&carv0_reserved>, <&carv0_vdev0vring0>,
          <&carv0_vdev0vring1>, <&carv0_vdev0buffer>, <&carv0_packet_sram>;
      memory-region-names = "carv-reserved","vdev0vring0",
          "vdev0vring1","vdev0buffer","packet-sram";
      nxp,s32n7-carv-mem-region-types = <CARV_MEM_NONCOHERENT>,<CARV_MEM_NONCOHERENT>,
          <CARV_MEM_NONCOHERENT>,<CARV_MEM_NONCOHERENT>,<CARV_MEM_SHARED>;
    };