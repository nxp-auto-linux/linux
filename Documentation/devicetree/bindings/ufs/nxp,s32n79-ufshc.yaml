%YAML 1.2
---
$id: http://devicetree.org/schemas/ufs/nxp,s32n79-ufshc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP S32N79 Universal Flash Storage (UFS) Controller

maintainers:
  - Larisa Grigore <larisa.grigore@nxp.com>

# Select only our matches, not all jedec,ufs
select:
  properties:
    compatible:
      contains:
        const: nxp,s32n79-ufshc
  required:
    - compatible

allOf:
  - $ref: ufs-common.yaml

properties:
  compatible:
    items:
      - const: nxp,s32n79-ufshc
      - const: jedec,ufs-3.0

  reg:
    minItems: 1
    items:
      - description: UFS Host Controller registers
      - description: System Control Module registers

  reg-names:
    description: |
      Names for the register regions. The first entry must be "ufshc".
      The second entry "scm" is mandatory only when nxp,mphy-boot-mode
      property is present.
    minItems: 1
    items:
      - const: ufshc
      - const: scm

  clocks:
    maxItems: 1
    description: UFS core clock

  clock-names:
    items:
      - const: core_clk

  nxp,mphy-boot-mode:
    description: |
      MPHY initialization mode. Defines how the MPHY firmware should be
      initialized and executed during UFS controller startup.
      If this property is not specified, MPHY initialization will be skipped.
    $ref: /schemas/types.yaml#/definitions/string
    oneOf:
      - const: rom
        description: |
          Execute MPHY firmware directly from the internal ROM. The controller
          will use the factory-programmed firmware stored in the internal ROM
          without any modifications.
      - const: copy-sram
        description: |
          Copy MPHY firmware from ROM to external SRAM and execute from there.
          This mode allows for firmware modifications to be applied to the SRAM
          copy before execution.

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    ufshc@4ac80000 {
        compatible = "nxp,s32n79-ufshc", "jedec,ufs-3.0";
        reg = <0x4ac80000 0x1000>, <0x4ac40000 0x1000>;
        reg-names = "ufshc", "scm";
        interrupt-parent = <&irqsteer0_coss>;
        interrupts = <211>;
        clocks = <&sys_clk>;
        clock-names = "core_clk";
        status = "disabled";
    };
