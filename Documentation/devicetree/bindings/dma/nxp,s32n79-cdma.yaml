%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/nxp,s32n79-cdma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP S32N79 Central DMA (CDMA) Controller

maintainers:
  - Ciprian Marian Costea <ciprianmarian.costea@nxp.com>

description: |
  The Central DMA (CDMA) is a DMA engine in the NXP S32N79 SoC's High-Speed
  Coherent Subsystem (HSCS). It appears as a PCIe Root Complex integrated
  Endpoint (RCiEP) with up to 48 Station Interfaces (SIs), each exposed as a
  separate PCI function using Enhanced Allocation (EA) capability for register
  access.

  Each SI provides up to 16 BD (Buffer Descriptor) rings and supports MSI-X
  interrupts. The CDMA supports memory copy transfers, pipe-based cross-SI
  transfers, scatter/gather, and multicast operations.

  CDMA SIs are enumerated by a generic ECAM PCI host bridge. This binding
  describes the PCI function child nodes under the host bridge for per-SI
  configuration.

properties:
  compatible:
    items:
      - const: pci1131,e200
      - const: nxp,s32n79-cdma

  reg:
    maxItems: 1
    description:
      Standard PCI device address in the parent PCI bus address space.

required:
  - compatible
  - reg

allOf:
  - $ref: /schemas/pci/pci-device.yaml

unevaluatedProperties: false

examples:
  - |
    pcie {
        compatible = "pci-host-ecam-generic";
        reg = <0x3 0x00000000 0x0 0x1800000>;
        #address-cells = <3>;
        #size-cells = <2>;
        device_type = "pci";
        bus-range = <0x0 0x0>;
        dma-coherent;
        ranges = <0x82000000 0x0 0x4d000000
                  0x0 0x4d000000 0x0 0x620000>;

        cdma@0,0 {
            compatible = "pci1131,e200", "nxp,s32n79-cdma";
            reg = <0x0000 0 0 0 0>;
        };
    };
