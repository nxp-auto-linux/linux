%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/nxp,s32n79-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP S32N79 PCIe Root Complex controller

maintainers:
  - Valentin Ciocoi Radulescu <valentin.ciocoi@nxp.com>

description: |
  This PCIe controller is based on the Synopsys DesignWare PCIe IP.
  The S32N79 SoC has up to four PCIe controllers, which can be configured
  as either Root Complex or Endpoint.

properties:
  compatible:
    const: nxp,s32n79-pcie

  reg:
    maxItems: 4

  reg-names:
    items:
      - const: dbi
      - const: atu
      - const: config
      - const: pcm

  interrupts:
    maxItems: 1

  interrupt-names:
    items:
      - const: misc

  msi-parent:
    description: |
      Use this option to reference the GIC controller node which will
      handle the MSIs. This property can be used only in Root Complex mode.
      The msi-parent node must be declared as "msi-controller".
      If "msi-parent" is not present in the PCIe node, MSIs will be handled
      by iMSI-RX -Integrated MSI Receiver [AXI Bridge]-, an integrated
      MSI reception module in the PCIe controller's AXI Bridge which
      detects and terminates inbound MSI requests (received on the RX wire).
      These MSIs no longer appear on the AXI bus, instead a hard-wired
      interrupt is raised, documented as "DSP AXI MSI Interrupt" in the SoC
      Reference Manual.

  nxp,coherency-boundary:
    $ref: /schemas/types.yaml#/definitions/uint64
    description: |
      Physical address boundary that separates coherent memory space from
      non-coherent peripheral space. The PCIe controller uses this boundary
      to determine coherency handling for transactions.

      Addresses above this boundary are treated as coherent memory, while
      addresses below are treated as non-coherent peripheral space.

      Typically set to the base address of DDR as seen by the system.

required:
  - compatible
  - reg
  - reg-names
  - ranges
  - msi-parent
  - msi-map
  - interrupts
  - interrupt-names
  - nxp,coherency-boundary

allOf:
  - $ref: /schemas/pci/snps,dw-pcie.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        pcie2: pcie@4c800000 {
            compatible = "nxp,s32n79-pcie";
            device_type = "pci";
            nxp,coherency-boundary = <0x0 0x80000000>;
            #interrupt-cells = <1>;
            #address-cells = <3>;
            #size-cells = <2>;

            reg = <0x00 0x4c800000 0x0 0x00001000>,
                  <0x00 0x4c910000 0x0 0x00020000>,
                  <0x00 0x6Bffe000 0x0 0x00002000>,
                  <0x00 0x4ba80000 0x0 0x00001000>;
            reg-names = "dbi", "atu", "config", "pcm";
            ranges = /* 65528KB outbound mem (64MB - 8KB config region) */
                     <0x02000000 0x0 0x00000000 0x0 0x68000000 0x0 0x3ffe000>,
                     /* 32GB outbound mem */
                     <0x03000000 0x1 0x00000000 0x50 0x00000000 0x8 0x00000000>;

            bus-range = <0x0 0xff>;

            msi-parent = <&its>;
            msi-map = <0x0 &its 0x30000 0x10000>;
            interrupt-map-mask = <0 0 0 0x7>;
            interrupt-map = <0 0 0 1 &gic 0 GIC_SPI 502 IRQ_TYPE_LEVEL_HIGH>,
                            <0 0 0 2 &gic 0 GIC_SPI 503 IRQ_TYPE_LEVEL_HIGH>,
                            <0 0 0 3 &gic 0 GIC_SPI 504 IRQ_TYPE_LEVEL_HIGH>,
                            <0 0 0 4 &gic 0 GIC_SPI 505 IRQ_TYPE_LEVEL_HIGH>;
            interrupts = <GIC_SPI 507 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "misc";

            num-lanes = <2>;
            max-link-speed = <4>;
        };
    };
