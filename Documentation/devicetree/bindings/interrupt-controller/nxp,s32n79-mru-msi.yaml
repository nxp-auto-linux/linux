%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/nxp,s32n79-mru-msi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP S32N79 MRU MSI-X Controller

description:
  The Message Receive Unit (MRU) MSI-X controller provides MSI-X-style
  interrupt support for the S32N79 SoC. It manages multiple MRU instances
  and forwards peripheral MSI-X interrupts as SPI interrupts to the GIC.

maintainers:
  - NXP S32 Linux Team <s32@nxp.com>

allOf:
  - $ref: /schemas/interrupt-controller/msi-controller.yaml#

properties:
  compatible:
    const: nxp,s32n79-mru-msi

  reg:
    minItems: 1
    description:
      Register addresses for each MRU instance. Each entry corresponds
      to the Global Channel (GC) register space.

  interrupts:
    minItems: 1
    description:
      Interrupts for each MRU channel. Each MRU channel has a dedicated
      interrupt line. The number of interrupts must match the number of
      reg entries.

  msi-controller: true

required:
  - compatible
  - reg
  - interrupts
  - msi-controller

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    msi-controller@40a00000 {
        compatible = "nxp,s32n79-mru-msi";
        msi-controller;
        reg = <0x40a00000 0x1000>,
              <0x40a40000 0x1000>,
              <0x40a80000 0x1000>,
              <0x40ac0000 0x1000>,
              <0x40b00000 0x1000>,
              <0x40b40000 0x1000>,
              <0x40b80000 0x1000>,
              <0x40bc0000 0x1000>;
        interrupts = <GIC_SPI 704 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 705 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 706 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 707 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 708 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 709 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 710 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 711 IRQ_TYPE_LEVEL_HIGH>;
    };
