%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/nxp,carv-uio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP CAR-V Accelerator

description:
  Binding for NXP CAR-V user nodes, initially found on NXP S32N7x SoCs, which
  represent individual users within a partition of the CAR-V device. Each partition
  may contain up to 4 users, defined directly in the partition node.
  CAR-V comprises a grid of many small, interconnected cores running at high
  frequency to allow for a high degree of parallelism.

maintainers:
  - Andrei-Edward Popa <andrei.popa_1@nxp.com>

properties:
  compatible:
    enum:
      - nxp,carv-uio
    description:
      The compatible string for a CAR-V user nodes within a CAR-V partition.

  reg:
    minItems: 1
    maxItems: 2
    description:
      MMIO register space assigned to this CAR-V user.
      If CAR-V partition has N quartiles, it must have N 'reg' entries.

  interrupts:
    maxItems: 1
    description:
      Interrupt assigned to this CAR-V user.

  dma-coherent: true

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    /* Setup for users containing 1 quartile */
    carv-user@47810000 {
        compatible = "nxp,carv-uio";
        reg = <0x47810000 0x10000>;
        interrupts = <GIC_SPI 251 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };

    carv-user@47820000 {
        compatible = "nxp,carv-uio";
        reg = <0x47820000 0x10000>;
        interrupts = <GIC_SPI 253 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };

    carv-user@47830000 {
        compatible = "nxp,carv-uio";
        reg = <0x47830000 0x10000>;
        interrupts = <GIC_SPI 255 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };

    carv-user@47840000 {
        compatible = "nxp,carv-uio";
        reg = <0x47840000 0x10000>;
        interrupts = <GIC_SPI 257 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };

    carv-user@47860000 {
        compatible = "nxp,carv-uio";
        reg = <0x47860000 0x10000>;
        interrupts = <GIC_SPI 259 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };

    carv-user@47870000 {
        compatible = "nxp,carv-uio";
        reg = <0x47870000 0x10000>;
        interrupts = <GIC_SPI 261 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };

    carv-user@47880000 {
        compatible = "nxp,carv-uio";
        reg = <0x47880000 0x10000>;
        interrupts = <GIC_SPI 263 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };

    carv-user@47890000 {
        compatible = "nxp,carv-uio";
        reg = <0x47890000 0x10000>;
        interrupts = <GIC_SPI 265 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    /* Setup for users containing 2 quartiles */
    carv-user@47810000 {
        compatible = "nxp,carv-uio";
        reg = <0x47810000 0x10000>,<0x47860000 0x10000>;
        interrupts = <GIC_SPI 251 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };

    carv-user@47820000 {
        compatible = "nxp,carv-uio";
        reg = <0x47820000 0x10000>,<0x47870000 0x10000>;
        interrupts = <GIC_SPI 253 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };

    carv-user@47830000 {
        compatible = "nxp,carv-uio";
        reg = <0x47830000 0x10000>,<0x47880000 0x10000>;
        interrupts = <GIC_SPI 255 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };

    carv-user@47840000 {
        compatible = "nxp,carv-uio";
        reg = <0x47840000 0x10000>,<0x47890000 0x10000>;
        interrupts = <GIC_SPI 257 IRQ_TYPE_LEVEL_HIGH>;
        status = "okay";
    };
