%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/nxp,carv-partition.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP CAR-V Accelerator

description:
  Binding for NXP CAR-V partition nodes, initially found on NXP S32N7x SoCs,
  which represent isolated execution environments within the CAR-V device.
  CAR-V comprises a grid of many small, interconnected cores running at high
  frequency to allow for a high degree of parallelism.

maintainers:
  - Andrei-Edward Popa <andrei.popa_1@nxp.com>

properties:
  compatible:
    items:
      - const: nxp,carv-partition
      - const: simple-mfd
    description:
      The compatible string for a CAR-V partition within the CAR-V device.
      Uses "simple-mfd" to indicate it can have child nodes.

  reg:
    minItems: 1
    maxItems: 2
    description:
      Base address and size of the CAR-V partition's memory-mapped region.
      If CAR-V partition has N quartiles, it must have N 'reg' entries.

  ranges:
    minItems: 1
    maxItems: 2
    description:
      Address translation mapping for child nodes, defining MMIO region offsets.
      Must correspond to the 2 quartiles in the CAR-V partition.

  '#address-cells':
    const: 1
    description:
      Specifies that child nodes use single address cells.

  '#size-cells':
    const: 1
    description:
      Specifies that child nodes use single size cells.

  nxp,stack-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [8, 16, 32, 64, 128]
    default: 64
    description:
      Defines the stack size for this CAR-V partition, in KB.

patternProperties:
  "^carv-user@[0-9a-f]+$":
    oneOf:
      - $ref: /schemas/remoteproc/nxp,carvnet-rproc.yaml#
      - $ref: /schemas/misc/nxp,carv-uio.yaml#
    type: object
    description:
      Only one CAR-V remoteproc user within a CAR-V partition is allowed.
      All CAR-V users can bind the CAR-V UIO driver within a CAR-V partition.
    properties:
      compatible:
        oneOf:
          - enum:
              - nxp,carvnet-rproc
              - nxp,carv-uio
    additionalProperties: true

required:
  - compatible
  - reg
  - ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    /* Setup for a partition consisting of 1 quartile and 4 UIO users. */
    carv-partition@47800000 {
        compatible = "nxp,carv-partition", "simple-mfd";
        reg = <0x47800000 0x10000>;
        ranges = <0x47800000 0x47800000 0x50000>;
        #address-cells = <1>;
        #size-cells = <1>;
        status = "okay";

        nxp,stack-size = <8>;

        carv-user@47810000 {
            compatible = "nxp,carv-uio";
            reg = <0x47810000 0x10000>;
            interrupts = <GIC_SPI 251 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };

        carv-user@47820000 {
            compatible = "nxp,carv-uio";
            reg = <0x47820000 0x10000>;
            interrupts = <GIC_SPI 253 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };

        carv-user@47830000 {
            compatible = "nxp,carv-uio";
            reg = <0x47830000 0x10000>;
            interrupts = <GIC_SPI 255 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };

        carv-user@47840000 {
            compatible = "nxp,carv-uio";
            reg = <0x47840000 0x10000>;
            interrupts = <GIC_SPI 257 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };
    };

    /* Setup for a partition consisting of 1 quartile and 4 UIO users. */
    carv-partition@47850000 {
        compatible = "nxp,carv-partition", "simple-mfd";
        reg = <0x47850000 0x10000>;
        ranges = <0x47500000 0x47850000 0x50000>;
        #address-cells = <1>;
        #size-cells = <1>;
        status = "okay";

        carv-user@47860000 {
            compatible = "nxp,carv-uio";
            reg = <0x47860000 0x10000>;
            interrupts = <GIC_SPI 259 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };

        carv-user@47870000 {
            compatible = "nxp,carv-uio";
            reg = <0x47870000 0x10000>;
            interrupts = <GIC_SPI 261 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };

        carv-user@47880000 {
            compatible = "nxp,carv-uio";
            reg = <0x47880000 0x10000>;
            interrupts = <GIC_SPI 263 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };

        carv-user@47890000 {
            compatible = "nxp,carv-uio";
            reg = <0x47890000 0x10000>;
            interrupts = <GIC_SPI 265 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };
    };
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    /* Setup for a partition consisting of 2 quartiles and 4 UIO users. */
    carv-partition@47800000 {
        compatible = "nxp,carv-partition", "simple-mfd";
        reg = <0x47800000 0x10000>,<0x47850000 0x10000>;
        ranges = <0x47800000 0x47800000 0x50000>,
                 <0x47850000 0x47850000 0x50000>;
        #address-cells = <1>;
        #size-cells = <1>;
        status = "okay";

        nxp,stack-size = <32>;

        carv-user@47810000 {
            compatible = "nxp,carv-uio";
            reg = <0x47810000 0x10000>,<0x47860000 0x10000>;
            interrupts = <GIC_SPI 251 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };

        carv-user@47820000 {
            compatible = "nxp,carv-uio";
            reg = <0x47820000 0x10000>,<0x47870000 0x10000>;
            interrupts = <GIC_SPI 253 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };

        carv-user@47830000 {
            compatible = "nxp,carv-uio";
            reg = <0x47830000 0x10000>,<0x47880000 0x10000>;
            interrupts = <GIC_SPI 255 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };

        carv-user@47840000 {
            compatible = "nxp,carv-uio";
            reg = <0x47840000 0x10000>,<0x47890000 0x10000>;
            interrupts = <GIC_SPI 257 IRQ_TYPE_LEVEL_HIGH>;
            status = "okay";
        };
    };
