%YAML 1.2
---
$id: http://devicetree.org/schemas/firmware/nxp,ddr-scmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: S32N SCMI NXP DDR Vendor Protocol Extension

maintainers:
  - NXP S32 Linux Team <s32@nxp.com>

properties:
  protocol@8b:
    $ref: '/schemas/firmware/arm,scmi.yaml#/$defs/protocol-node'
    unevaluatedProperties: false

    description:
      NXP DDR protocol node for S32 platforms. This protocol provides
      runtime discovery of the available DDR regions and partial DRAM
      initialization.

    properties:
      reg:
        const: 0x8b

      nxp,ddr-regions:
        $ref: /schemas/types.yaml#/definitions/phandle-array
        minItems: 1
        description: |
          Optional policy list restricting which DDR regions this OS instance
          brings online. Each phandle refers to a memory node:

            - a disabled node is initialized and hot-added;
            - an enabled node is already boot memory and is left alone.

          Omit the property to bring online every region the platform reports.

    required:
      - reg

additionalProperties: false

examples:
  - |
    firmware {
      scmi {
        #address-cells = <1>;
        #size-cells = <0>;

        nxp_ddr: protocol@8b {
          reg = <0x8b>;
        };
      };
    };
