%YAML 1.2
---
$id: http://devicetree.org/schemas/firmware/nxp,ddr-scmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: S32N SCMI NXP DDR Vendor Protocol Extension

maintainers:
  - NXP S32 Linux Team <s32@nxp.com>

properties:
  protocol@8b:
    $ref: '/schemas/firmware/arm,scmi.yaml#/$defs/protocol-node'
    unevaluatedProperties: false

    description:
      NXP DDR protocol node for S32 platforms. This protocol provides
      runtime discovery of the uninitialized DDR regions and partial DRAM
      initialization.

    properties:
      reg:
        const: 0x8b

      nxp,ddr-regions:
        $ref: /schemas/types.yaml#/definitions/phandle-array
        minItems: 1
        description:
          List of phandles to reserved memory regions that represent
          DDR areas to be initialized using the SCMI NXP DDR protocol.

    required:
      - reg

additionalProperties: false

examples:
  - |
    ddr_high0: memory@8800000000 {
      device_type = "memory";
      reg = <0x88 0x00000000 0x3 0x40000000>;
      status = "disabled";
    };

    ddr_high1: memory@c000000000 {
      device_type = "memory";
      reg = <0xc0 0x00000000 0x3 0x40000000>;
      status = "disabled";
    };

    firmware {
      scmi {
        #address-cells = <1>;
        #size-cells = <0>;

        nxp_ddr: protocol@8b {
          reg = <0x8b>;
          nxp,ddr-regions = <&ddr_high0>, <&ddr_high1>;
        };
      };
    };
